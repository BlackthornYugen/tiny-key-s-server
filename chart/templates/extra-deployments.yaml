{{- $extraChains := include "tiny-key-s-server.extraChains" . | fromJsonArray -}}
{{- if $extraChains -}}
{{- range $chain := $extraChains }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-chain-{{ $chain }}
  labels:
    app: {{ $.Release.Name }}-chain-{{ $chain }}
    release: {{ $.Release.Name }}
    chain: {{ $chain | quote }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-chain-{{ $chain }}
  template:
    metadata:
      labels:
        app: {{ $.Release.Name }}-chain-{{ $chain }}
        release: {{ $.Release.Name }}
        chain: {{ $chain | quote }}
    spec:
      enableServiceLinks: false
      containers:
      - name: s-server
        image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - containerPort: {{ $.Values.service.targetPort | default 4433 }}
          name: https
        {{- if $.Values.probes.liveness.enabled }}
        livenessProbe:
          httpGet:
            path: {{ $.Values.probes.liveness.path | default "/index.html" }}
            port: https
            scheme: {{ $.Values.probes.liveness.scheme | default "HTTPS" }}
          initialDelaySeconds: {{ $.Values.probes.liveness.initialDelaySeconds | default 5 }}
          periodSeconds: {{ $.Values.probes.liveness.periodSeconds | default 10 }}
          timeoutSeconds: {{ $.Values.probes.liveness.timeoutSeconds | default 3 }}
        {{- end }}
        {{- if $.Values.probes.readiness.enabled }}
        readinessProbe:
          httpGet:
            path: {{ $.Values.probes.readiness.path | default "/index.html" }}
            port: https
            scheme: {{ $.Values.probes.readiness.scheme | default "HTTPS" }}
          initialDelaySeconds: {{ $.Values.probes.readiness.initialDelaySeconds | default 3 }}
          periodSeconds: {{ $.Values.probes.readiness.periodSeconds | default 5 }}
          timeoutSeconds: {{ $.Values.probes.readiness.timeoutSeconds | default 3 }}
        {{- end }}
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        env:
        - name: PORT
          value: {{ $.Values.service.targetPort | default 4433 | quote }}
        {{- range $key, $val := $.Values.env }}
        {{- if ne $key "CHAIN_MODE" }}
        - name: {{ $key }}
          value: {{ $val | quote }}
        {{- end }}
        {{- end }}
        - name: CHAIN_MODE
          value: {{ $chain | quote }}
        {{- if $.Values.persistence.enabled }}
        volumeMounts:
        - name: certs
          mountPath: {{ $.Values.persistence.mountPath | default "/certs" }}
        {{- end }}
      {{- if $.Values.persistence.enabled }}
      volumes:
      - name: certs
        persistentVolumeClaim:
          claimName: {{ $.Values.persistence.existingClaim | default (printf "%s-certs" $.Release.Name) }}
      {{- end }}
{{- end }}
{{- end }}
