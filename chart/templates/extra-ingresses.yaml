{{- $extraChains := include "tiny-key-s-server.extraChains" . | fromJsonArray -}}
{{- if and .Values.ingress.enabled $extraChains -}}
{{- range $chain := $extraChains }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $.Release.Name }}-chain-{{ $chain }}
  labels:
    app: {{ $.Release.Name }}-chain-{{ $chain }}
    release: {{ $.Release.Name }}
    chain: {{ $chain | quote }}
  annotations:
    haproxy.org/ssl-passthrough: "true"
    haproxy.org/check: "false"
    {{- with $.Values.ingress.extraAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if $.Values.ingress.className }}
  ingressClassName: {{ $.Values.ingress.className }}
  {{- end }}
  rules:
  {{- range $.Values.ingress.hosts }}
  - host: {{ printf "%s-%s" $chain . | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ $.Release.Name }}-chain-{{ $chain }}
            port:
              number: {{ $.Values.service.port | default 443 }}
  {{- end }}
{{- end }}
{{- end }}
