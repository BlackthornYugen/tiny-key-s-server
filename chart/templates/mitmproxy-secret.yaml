{{- if and .Values.mitmproxy.enabled .Values.mitmproxy.customCa.enabled (not .Values.mitmproxy.customCa.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-mitmproxy-ca
  labels:
    app: {{ .Release.Name }}
type: Opaque
stringData:
  mitmproxy-ca.pem: |
{{- if .Values.mitmproxy.customCa.rawPem }}
{{ .Values.mitmproxy.customCa.rawPem | indent 4 }}
{{- else }}
{{- if .Values.mitmproxy.customCa.key }}
{{ .Values.mitmproxy.customCa.key | indent 4 }}
{{- end }}
{{- if .Values.mitmproxy.customCa.cert }}
{{ .Values.mitmproxy.customCa.cert | indent 4 }}
{{- end }}
{{- if .Values.mitmproxy.customCa.chain }}
{{ .Values.mitmproxy.customCa.chain | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
