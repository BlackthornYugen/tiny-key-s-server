apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
  - port: {{ .Values.service.port | default 443 }}
    targetPort: {{ .Values.service.targetPort | default 4433 }}
    protocol: TCP
    name: https
  {{- $extraChains := include "tiny-key-s-server.extraChains" . | fromJsonArray -}}
  {{- range $idx, $chain := $extraChains }}
  - port: {{ add 4434 $idx }}
    targetPort: {{ add 4434 $idx }}
    protocol: TCP
    name: chain-{{ $chain }}
  {{- end }}
  selector:
    app: {{ .Release.Name }}
