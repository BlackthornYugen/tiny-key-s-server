image:
  repository: git.tower.jskw.dev/webapps/tiny-key-s-server
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

replicaCount: 1

service:
  type: ClusterIP
  port: 443
  targetPort: 4433

# Default public access port (8443 while HAProxy controller runs on port 8443)
publicPort: 8443

ingress:
  enabled: true
  className: "haproxy"
  publicPort: 8443
  annotations:
    haproxy.org/server-ssl: "true"
    haproxy.org/ssl-passthrough: "false"
    haproxy.org/check: "false"
    haproxy.org/backend-config-snippet: |
      http-request redirect location /index.html code 302 if { path / }
  # Array of domains for the ingress
  hosts:
    - tiny-key-s-server.jskw.dev

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Mount external certificate fullchain if provided
persistence:
  enabled: false
  # existingClaim: ""
  # storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /certs

probes:
  liveness:
    enabled: true
    path: /index.html
    scheme: HTTPS
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    enabled: true
    path: /index.html
    scheme: HTTPS
    initialDelaySeconds: 3
    periodSeconds: 5

# OpenSSL s_server configuration
env:
  S_BYTES: "0x01"
  CHAIN_MODE: "default"
  ROOTS: "c1,c2"
  ROOT_S_BYTES: "0x10,0x20"
  WWW_MODE: "WWW"
  CA_CURVE: "prime256v1"
  SERVER_CURVE: "prime256v1"
  CA_SUBJECT: "/CN=Test OpenSSL CA/O=Test Lab/C=CA"
  SERVER_SUBJECT: "/CN=localhost/O=Test Lab/C=CA"
  DOMAINS: "tiny-key-s-server.jskw.dev,localhost"
  IPS: "127.0.0.1"

# mitmproxy sidecar container configuration (disabled by default)
mitmproxy:
  enabled: false
  image:
    repository: mitmproxy/mitmproxy
    tag: latest
    pullPolicy: IfNotPresent
  # Execution mode: "mitmweb" (interactive web UI) or "mitmdump" (lightweight headless proxy)
  mode: mitmweb
  # Optional password for the mitmweb UI (also accessible via http://<host>:8081/?token=<password>).
  # If left empty, mitmproxy generates a random token on startup printed in container logs.
  webPassword: ""
  # Optional proxy authentication in "username:password" format for clients connecting to port 8080.
  # Essential when exposing the proxy publicly (e.g. via NodePort) to prevent open proxy relay abuse.
  proxyAuth: ""
  # Extra CLI arguments passed to mitmproxy / mitmweb
  extraArgs: []
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  service:
    proxyPort: 8080
    webPort: 8081
    # Optional public NodePort on cluster nodes for port 8080 (e.g. 30800)
    proxyNodePort: null
  ingress:
    enabled: false
    className: "haproxy"
    annotations: {}
    # Array of hosts for the mitmweb UI ingress. If empty, automatically derived from ingress.hosts
    # e.g. pr-2-tiny-key-s-server.jskw.dev -> pr-2-mitm-tiny-key-s-server.jskw.dev
    hosts: []
  # Dynamic integration with tiny-key-s-server generated CA & chains
  serverCa:
    # Which chain generated by tiny-key-s-server to assemble into mitmproxy-ca.pem:
    # "default"  -> ca.key.pem + ca.crt.pem
    # "chain"    -> ca.key.pem + chain.pem (active CHAIN_MODE configured in env)
    # "c1", "c2" -> ca.key.pem + chains/c1.pem, etc.
    # "all"      -> ca.key.pem + chains/*.pem (all cross-signed paths bundled)
    chainMode: "default"
  # Provide custom CA and cross-signed chains directly in values
  customCa:
    enabled: false
    # Existing Secret name containing 'mitmproxy-ca.pem' (overrides key/cert/chain below if set)
    existingSecret: ""
    # Or assemble a custom Secret from inline PEM blocks:
    # Complete combined PEM containing private key and full chain:
    rawPem: ""
    # Or broken down into separate components:
    key: ""   # Intermediate CA private key (PEM format)
    cert: ""  # Intermediate CA certificate (PEM format)
    chain: "" # Cross-signed parent/intermediate certificates or root (PEM format)

