apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tiny-key-s-server-main
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.tower.jskw.dev/webapps/tiny-key-s-server.git
    path: ./chart
    targetRevision: v*
    helm:
      parameters:
        - name: image.repository
          value: git.tower.jskw.dev/webapps/tiny-key-s-server
        - name: image.pullPolicy
          value: Always
      valuesObject:
        ingress:
          enabled: true
          hosts:
            - tiny-key-s-server.jskw.dev
            - tiny-key-s-server.jskw.ca
            - tiny-key-s-server.jsteelkw.ca
            - tiny-key-s-server.jsteelkw.dev
            - tiny-key-s-server.jsteel.ca
            - tiny-key-s-server.jsteel.dev
  destination:
    server: https://kubernetes.default.svc
    namespace: tiny-key-s-server
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
