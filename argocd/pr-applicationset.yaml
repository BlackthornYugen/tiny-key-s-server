apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: tiny-key-s-server-prs
  namespace: argocd
spec:
  generators:
    - pullRequest:
        gitea:
          owner: webapps
          repo: tiny-key-s-server
          api: https://git.tower.jskw.dev/
        requeueAfterSeconds: 60
  template:
    metadata:
      name: 'tiny-key-s-server-pr-{{number}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: 'https://git.tower.jskw.dev/webapps/tiny-key-s-server.git'
        targetRevision: '{{head_sha}}'
        path: chart
        helm:
          parameters:
            - name: image.tag
              value: '{{head_sha}}'
            - name: ingress.enabled
              value: "true"
            - name: image.repository
              value: git.tower.jskw.dev/webapps/tiny-key-s-server
            - name: ingress.hosts[0]
              value: 'pr-{{number}}-tiny-key-s-server.jskw.dev'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'tiny-key-s-server-pr-{{number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
